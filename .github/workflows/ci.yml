name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app tests
      - name: Unit tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-root
      WAREHOUSE_DB_PASSWORD: ci-readonly
      APP_DB_PASSWORD: ci-app
      API_KEY: ci-key
      GEMINI_API_KEY: unused
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL with schema and seed data
        run: docker compose up -d --wait mysql
      - name: MySQL logs
        if: failure()
        run: docker compose logs mysql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: Integration tests against real MySQL
        working-directory: backend
        env:
          WAREHOUSE_URL: mysql+aiomysql://warehouse_ro:ci-readonly@127.0.0.1:3306/telecom_dw
        run: pytest -m integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ask-your-database-api backend
      - name: Build frontend image
        run: docker build -t ask-your-database-frontend frontend
